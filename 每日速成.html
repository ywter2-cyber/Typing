<!doctype html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="零基礎學速成中文打字：新手課程、初中高三級，以及香港生活字句無限模式。">
<meta property="og:title" content="速成字牌">
<meta property="og:description" content="麻雀牌打字遊戲，零基礎學識速成。句子全部係香港人日常用嘅。">
<meta name="theme-color" content="#143e30">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{box-sizing:border-box}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>速成字牌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{
  /* Layout: one-screen game table — green felt play area on top, a keyboard of ivory mahjong tiles below */
  --felt:#1d5642; --felt-2:#143e30; --felt-hi:#2a6c54;
  --ivory:#f8f2df; --ivory-2:#e9dfc1; --jade:#2f8b5b; --jade-dk:#1d6441;
  --ink:#211d16; --ink-soft:#6a6252;
  --red:#b3271d; --blue:#22489a; --green:#16623a;
  --gold:#e8bd52; --on-felt:#eef4ef; --on-felt-soft:#a8c7b7; --veil:rgba(255,255,255,.08); --veil-line:rgba(255,255,255,.18);
  --g0:#d6981a; --g1:#3b7fc6; --g2:#d4573c; --g3:#8b5bc4;
  --f-tile:"LXGW WenKai TC","Kaiti TC","STKaiti","BiauKai","DFKai-SB","KaiTi",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{height:100%;background:var(--felt-2)}
body{height:100%;margin:0;color:var(--on-felt);font-family:var(--f-body);font-size:15px;line-height:1.6;
  background:radial-gradient(ellipse 120% 80% at 50% 25%,var(--felt-hi) 0%,var(--felt) 45%,var(--felt-2) 100%);
  -webkit-tap-highlight-color:transparent;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;max-width:600px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.screen{flex:1;min-height:0;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
.hl{color:var(--gold);font-weight:700}
.small{font-size:13px;color:var(--on-felt-soft)}

/* ---------- tiles ---------- */
.tile{width:62px;height:82px;border-radius:9px;flex:none;
  background:linear-gradient(175deg,var(--ivory) 0%,var(--ivory) 60%,var(--ivory-2) 100%);
  box-shadow:0 6px 0 var(--jade),0 7px 0 var(--jade-dk),0 14px 18px rgba(0,0,0,.35);
  display:grid;place-items:center;font-family:var(--f-tile);font-weight:700;font-size:46px;line-height:1;color:var(--tile-ink,var(--ink));
  transition:opacity .2s,transform .2s}
.tile.sm{width:50px;height:66px;font-size:36px;border-radius:8px;box-shadow:0 5px 0 var(--jade),0 6px 0 var(--jade-dk),0 10px 14px rgba(0,0,0,.3)}
.tile.xs{width:40px;height:54px;font-size:28px;border-radius:7px;box-shadow:0 4px 0 var(--jade),0 5px 0 var(--jade-dk),0 8px 10px rgba(0,0,0,.25)}
.tile.xxs{width:35px;height:48px;font-size:24px;border-radius:6px;box-shadow:0 4px 0 var(--jade),0 5px 0 var(--jade-dk),0 8px 10px rgba(0,0,0,.25)}

/* ---------- shared blocks ---------- */
.scroll{overflow-y:auto;padding-block:18px 28px;display:flex;flex-direction:column;gap:20px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.card{background:var(--veil);border:1px solid var(--veil-line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.sect-label{font-size:12px;letter-spacing:.18em;color:var(--on-felt-soft);font-weight:500}
.btn{border:none;border-radius:11px;padding:11px 20px;font-weight:700;background:var(--gold);color:var(--ink);box-shadow:0 4px 0 #a9822a}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #a9822a}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:var(--veil);color:var(--on-felt);box-shadow:none;border:1px solid var(--veil-line)}
.icon-btn{width:34px;height:34px;border-radius:9px;border:1px solid var(--veil-line);background:var(--veil);display:grid;place-items:center;font-size:14px;flex:none}
.eq{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;padding-top:4px}
.eq .op{font-size:22px;color:var(--on-felt-soft)}
.eq .kc{display:flex;flex-direction:column;align-items:center;gap:8px}
.eq .kc small{font-family:var(--f-num);font-size:13px;color:var(--gold);font-weight:600;min-height:1.3em}
.rk{display:inline-flex;align-items:baseline;gap:5px;background:var(--ivory);color:var(--ink);border-radius:7px;padding:3px 9px 4px;box-shadow:0 3px 0 var(--jade-dk)}
.rk b{font-family:var(--f-tile);font-size:20px;line-height:1.2}
.rk small{font-family:var(--f-num);font-size:11px;color:var(--ink-soft)}
.brow{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}

/* ---------- menu ---------- */
.hero{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding-top:6px}
.hero-tiles{display:flex;gap:8px}
.hero-tiles .tile:nth-child(1){transform:rotate(-5deg) translateY(4px);--tile-ink:var(--red)}
.hero-tiles .tile:nth-child(2){transform:rotate(2deg);--tile-ink:var(--green)}
.hero-tiles .tile:nth-child(3){transform:rotate(-2deg) translateY(2px);--tile-ink:var(--blue)}
.hero-tiles .tile:nth-child(4){transform:rotate(4deg) translateY(5px);--tile-ink:var(--red)}
.hero p{color:var(--on-felt-soft);font-size:14px}
.course{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;text-align:left;border:none;border-radius:16px;padding:16px;
  background:linear-gradient(160deg,#f3d47e,var(--gold));color:var(--ink);box-shadow:0 5px 0 #a9822a}
.course:active{transform:translateY(3px);box-shadow:0 2px 0 #a9822a}
.course h2{font-size:18px}
.course p{font-size:13px;margin-top:2px;color:#4a3d1c}
.course .prog{font-family:var(--f-num);font-size:12px;text-align:right;white-space:nowrap;color:#4a3d1c}
.course .prog b{display:block;font-size:20px;color:var(--ink)}
.levels{display:flex;flex-direction:column;gap:14px}
.lvl{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;text-align:left;border:none;border-radius:14px;
  padding:12px 14px 12px 12px;background:var(--ivory);color:var(--ink);box-shadow:0 5px 0 var(--jade),0 6px 0 var(--jade-dk);transition:transform .12s,box-shadow .12s}
.lvl:hover{transform:translateY(-1px)}
.lvl:active{transform:translateY(3px);box-shadow:0 2px 0 var(--jade),0 3px 0 var(--jade-dk)}
.lvl .tile{box-shadow:none;border:2px solid var(--ivory-2);background:#fffaf0}
.lvl h3{font-size:17px;font-weight:700}
.lvl h3 span{font-size:13px;font-weight:500;color:var(--ink-soft);margin-left:6px}
.lvl p{margin-top:2px;font-size:13px;color:var(--ink-soft);line-height:1.5}
.lvl .best{font-family:var(--f-num);font-size:12px;color:var(--ink-soft);text-align:right;white-space:nowrap}
.lvl .best b{display:block;font-size:17px;color:var(--ink)}
details.roots{background:var(--veil);border:1px solid var(--veil-line);border-radius:14px;padding:4px 16px}
details.roots summary{cursor:pointer;padding:10px 0;font-weight:700;font-size:15px;list-style:none;display:flex;justify-content:space-between}
details.roots summary::-webkit-details-marker{display:none}
details.roots summary::after{content:"＋";color:var(--gold)}
details.roots[open] summary::after{content:"－"}
.rgroups{display:grid;gap:14px;padding:4px 0 16px}
.rg h4{margin:0 0 6px;font-size:13px;font-weight:500;color:var(--on-felt-soft);display:flex;align-items:center;gap:8px}
.rg h4 i{width:8px;height:8px;border-radius:50%;display:inline-block}
.rg-list{display:flex;flex-wrap:wrap;gap:6px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13px;color:var(--on-felt-soft)}
.toggle{background:var(--veil);border:1px solid var(--veil-line);border-radius:999px;padding:6px 14px;font-size:13px;flex:none}

/* ---------- learn ---------- */
.lesson-list{display:flex;flex-direction:column;gap:10px}
.les{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;text-align:left;background:var(--veil);border:1px solid var(--veil-line);border-radius:14px;padding:12px 14px}
.les:hover{background:rgba(255,255,255,.12)}
.les .no{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;background:var(--ivory);color:var(--ink);font-family:var(--f-num);font-weight:600}
.les.done .no{background:var(--gold)}
.les h3{font-size:16px}
.les p{font-size:13px;color:var(--on-felt-soft);line-height:1.5}
.les .st{font-size:12px;color:var(--on-felt-soft);white-space:nowrap}
.les.done .st{color:var(--gold)}
.top{display:flex;align-items:center;gap:10px;padding-block:12px 6px}
.top h2{font-size:18px;flex:1;min-width:0}
.player{flex:1;min-height:0;display:flex;flex-direction:column}
.dots{display:flex;gap:4px;flex:none}
.dots i{width:14px;height:4px;border-radius:2px;background:var(--veil-line)}
.dots i.on{background:var(--gold)}
.lp-body{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding-block:8px 12px;scrollbar-width:none}
.lp-body::-webkit-scrollbar{display:none}
.lp-body h3{font-size:20px;line-height:1.35}
.lp-body > p{max-width:62ch}
.lp-actions{display:flex;gap:10px;padding-block:6px 8px}
.lp-actions .btn{flex:1}
.mini-kb{display:flex;flex-direction:column;gap:4px;padding:10px 6px;background:rgba(0,0,0,.18);border-radius:12px}
.mrow{display:flex;gap:3px;justify-content:center}
.mk{flex:0 0 calc((100% - 27px)/10);background:var(--ivory);color:var(--ink);border-radius:5px;text-align:center;padding:2px 0 1px;box-shadow:0 2px 0 var(--jade-dk);border-top:3px solid transparent}
.mk[data-g="0"]{border-top-color:var(--g0)}.mk[data-g="1"]{border-top-color:var(--g1)}.mk[data-g="2"]{border-top-color:var(--g2)}.mk[data-g="3"]{border-top-color:var(--g3)}
.mk.off{opacity:.4}
.mk b{display:block;font-family:var(--f-tile);font-size:16px;line-height:1.25}
.mk small{display:block;font-family:var(--f-num);font-size:9px;color:var(--ink-soft);line-height:1.3}
.grp{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:start}
.grp i{width:10px;height:10px;border-radius:50%;margin-top:7px}
.grp h4{margin:0;font-size:15px}
.grp p{grid-column:2;font-size:13px;color:var(--on-felt-soft)}
.grp .brow{grid-column:2;justify-content:flex-start}
.formgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.form{display:grid;grid-template-columns:44px 1fr;gap:2px 10px;align-items:center;background:var(--veil);border:1px solid var(--veil-line);border-radius:11px;padding:8px 10px}
.form .sym{grid-row:span 2;font-family:var(--f-tile);font-size:32px;text-align:center;line-height:1}
.form b{font-size:14px}
.form b code{font-family:var(--f-num);color:var(--gold);margin-left:4px}
.form small{font-size:12px;color:var(--on-felt-soft)}
.rule{display:grid;grid-template-columns:5.5em 1fr;gap:10px;align-items:center}
.rule .rn{font-weight:700;color:var(--gold);font-size:14px}
.ex{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px}
.ex .tile{box-shadow:0 3px 0 var(--jade),0 4px 0 var(--jade-dk)}
.ex code{font-family:var(--f-num);color:var(--gold);font-weight:600}
.keydemo{display:flex;gap:18px;justify-content:center;align-items:flex-end}
.keydemo figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--on-felt-soft)}
.kd{width:54px;height:54px;border-radius:8px;background:linear-gradient(var(--ivory),var(--ivory-2));box-shadow:0 4px 0 var(--jade),0 5px 0 var(--jade-dk);color:var(--ink);display:grid;place-items:center;position:relative}
.kd b{font-family:var(--f-tile);font-size:24px}
.kd small{position:absolute;left:5px;top:3px;font-family:var(--f-num);font-size:10px;color:var(--ink-soft)}
.kd.en b{font-family:var(--f-num);font-size:20px}
.howto{display:flex;flex-direction:column;gap:6px}
.howto h4{margin:0;font-size:15px;display:flex;gap:8px;align-items:center}
.howto ol{margin:0;padding-left:1.3em;font-size:14px;display:flex;flex-direction:column;gap:3px}
.kbd{font-family:var(--f-num);font-size:12px;background:var(--ivory);color:var(--ink);border-radius:5px;padding:1px 6px;box-shadow:0 2px 0 var(--jade-dk);white-space:nowrap}
.candbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center;background:rgba(0,0,0,.2);border-radius:10px;padding:8px}
.candbar .typed{font-family:var(--f-num);color:var(--gold);font-weight:600;margin-right:4px}
.cand{background:var(--ivory);color:var(--ink);border:none;border-radius:8px;padding:5px 12px;font-family:var(--f-tile);font-size:22px;font-weight:700;box-shadow:0 3px 0 var(--jade-dk)}
.cand small{font-family:var(--f-num);font-size:11px;color:var(--ink-soft);margin-right:4px;font-weight:500}
.cand.static{cursor:default}
.qhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.qhead h3{font-size:17px}
.qhead span{font-family:var(--f-num);font-size:13px;color:var(--on-felt-soft)}
.qprompt{display:flex;flex-direction:column;align-items:center;gap:12px;padding-block:6px;text-align:center}
.qfeed{min-height:1.6em;text-align:center;font-size:14px;color:var(--on-felt-soft)}
.qfeed.good{color:#bfe5b3}.qfeed.bad{color:#ffb4a6}

/* ---------- setup ---------- */
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{border:1px solid var(--veil-line);background:var(--veil);border-radius:10px;padding:8px 14px;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ivory);color:var(--ink);border-color:var(--ivory);font-weight:700;box-shadow:0 3px 0 var(--jade-dk)}
.opt{display:flex;flex-direction:column;gap:10px}
.opt .small{max-width:60ch}
.btn.big{padding:14px 20px;font-size:17px}

/* ---------- game ---------- */
.hud{display:flex;align-items:center;gap:10px;padding-block:10px 8px;font-size:13px}
.hud .lv{font-weight:700;letter-spacing:.04em;white-space:nowrap}
.hud .lv small{display:block;font-weight:400;color:var(--on-felt-soft);font-family:var(--f-num);font-size:11px;letter-spacing:0}
.hud .sp{flex:1}
.hearts{display:flex;gap:2px;font-size:17px;color:#ff8a78}
.hearts .lost{color:rgba(255,255,255,.18)}
.timer{font-family:var(--f-num);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;background:var(--veil);border:1px solid var(--veil-line);border-radius:8px;padding:2px 8px}
.timer.low{color:#ffb4a6;border-color:#ffb4a6}
.score{font-family:var(--f-num);font-weight:600;font-size:18px;font-variant-numeric:tabular-nums;min-width:4.2ch;text-align:right}
.combo{font-family:var(--f-num);font-size:12px;color:var(--gold);min-width:5ch;text-align:right}
.field{flex:1;min-height:170px;position:relative;overflow:hidden;border-radius:16px;
  background:
    repeating-linear-gradient(45deg,rgba(255,255,255,.018) 0 2px,transparent 2px 6px),
    radial-gradient(ellipse at 50% 0%,rgba(255,255,255,.07),transparent 70%),
    var(--felt-2);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.06),inset 0 10px 30px rgba(0,0,0,.25)}
.danger{position:absolute;left:0;right:0;bottom:16px;height:26%;background:linear-gradient(transparent,rgba(214,80,60,.14));pointer-events:none}
.rail{position:absolute;left:0;right:0;bottom:0;height:16px;background:linear-gradient(#93592b,#6a3e1c);box-shadow:0 -2px 0 rgba(0,0,0,.25)}
.tiles{position:absolute;left:0;right:0;top:12px;display:flex;justify-content:center;gap:7px;will-change:transform}
.tile.now{outline:3px solid var(--gold);outline-offset:3px}
.tile.done{opacity:.4;transform:translateY(5px) scale(.94)}
.tiles.pop{animation:pop .42s ease-out forwards}
.tiles.hit .tile{background:linear-gradient(#f6d7cf,#e7b8ac)}
.tiles.shake{animation:shake .28s}
@keyframes pop{to{transform:var(--ty) scale(1.2);opacity:0}}
@keyframes shake{0%,100%{translate:0}25%{translate:-7px}75%{translate:7px}}
.float{position:absolute;left:50%;font-family:var(--f-num);font-weight:600;font-size:20px;color:var(--gold);pointer-events:none;animation:rise .9s ease-out forwards;translate:-50% 0;text-shadow:0 2px 6px rgba(0,0,0,.4)}
@keyframes rise{to{transform:translateY(-46px);opacity:0}}
.overlay{position:absolute;inset:0;display:grid;place-items:center;text-align:center;background:rgba(10,30,22,.74);backdrop-filter:blur(2px);padding:20px}
.overlay .box{display:flex;flex-direction:column;align-items:center;gap:10px;max-width:330px}
.overlay h2{font-size:22px;font-weight:700}
.overlay p{color:var(--on-felt-soft);font-size:14px}
.hint{min-height:92px;padding-block:10px 6px;display:flex;flex-direction:column;justify-content:center;gap:7px;font-size:14px}
.hint .line{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.big{font-family:var(--f-tile);font-size:24px;font-weight:700;color:var(--gold);line-height:1}
.note{color:var(--on-felt-soft);font-size:13px}
.chip{display:inline-flex;align-items:center;gap:7px;background:var(--veil);border:1px solid var(--veil-line);border-radius:9px;padding:3px 10px 3px 8px;transition:background .15s}
.chip em{font-style:normal;font-size:11px;color:var(--on-felt-soft)}
.chip b{font-family:var(--f-tile);font-size:21px;line-height:1.25}
.chip code{font-family:var(--f-num);font-size:13px;font-weight:600;color:var(--gold);min-width:1ch}
.chip.ok{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.chip.ok em,.chip.ok code{color:var(--ink)}
.chip.next{border-color:var(--gold)}
.hint-btn{border:1px dashed var(--veil-line);background:transparent;border-radius:9px;padding:4px 12px;font-size:13px;color:var(--on-felt)}
.answer{color:#ffb4a6}

/* ---------- keyboard ---------- */
.kb{display:flex;flex-direction:column;gap:7px;padding-block:6px 10px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.row{display:flex;gap:4px;justify-content:center}
.key{flex:0 0 calc((100% - 36px)/10);height:50px;border:none;border-radius:7px;position:relative;padding:0;
  background:linear-gradient(var(--ivory),var(--ivory-2));color:var(--ink);box-shadow:0 4px 0 var(--jade),0 5px 0 var(--jade-dk);
  display:grid;place-items:center;transition:background .12s,transform .06s}
.key .r{font-family:var(--f-tile);font-weight:700;font-size:20px;line-height:1}
.key .l{position:absolute;left:4px;top:2px;font-family:var(--f-num);font-size:9.5px;color:var(--ink-soft)}
.key::after{content:"";position:absolute;right:4px;top:5px;width:5px;height:5px;border-radius:50%;background:var(--gc,transparent)}
.key[data-g="0"]{--gc:var(--g0)}.key[data-g="1"]{--gc:var(--g1)}.key[data-g="2"]{--gc:var(--g2)}.key[data-g="3"]{--gc:var(--g3)}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 var(--jade),0 2px 0 var(--jade-dk)}
.key.off{opacity:.38}
.key.mode{flex-basis:calc((100% - 36px)/10*1.6);background:linear-gradient(#2a7a50,var(--jade-dk));color:var(--on-felt-soft);box-shadow:0 4px 0 #134a30;
  display:flex;align-items:center;justify-content:center;gap:2px;font-size:15px}
.key.mode::after{display:none}
.key.mode .on{color:var(--gold);font-weight:700}
.key.glow{background:linear-gradient(#fff4c8,#f3d77a);animation:glow 1s ease-in-out infinite}
.key.good{background:linear-gradient(#e4f5df,#c8e6bd)}
.key.bad{background:linear-gradient(#f9d8d1,#efb6aa)}
@keyframes glow{50%{box-shadow:0 4px 0 var(--jade),0 5px 0 var(--jade-dk),0 0 0 4px rgba(232,189,82,.55)}}
body.kb-en .key .r{display:none}
body.kb-en .key .l{position:static;font-size:17px;font-weight:600;color:var(--ink)}
body.kb-en .key::after{display:none}
@media (min-width:520px){.key{height:56px}.key .r{font-size:23px}.key .l{font-size:10.5px}body.kb-en .key .l{font-size:19px}}

/* ---------- result ---------- */
.res-head{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding-top:10px}
.stars{font-size:38px;letter-spacing:6px;color:var(--gold)}
.stars .dim{color:rgba(255,255,255,.18)}
.res-head h2{font-size:24px;font-weight:700}
.res-head p{color:var(--on-felt-soft);font-size:14px}
.res-score{font-family:var(--f-num);font-size:44px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.res-score small{display:block;font-size:12px;font-weight:500;color:var(--on-felt-soft);font-family:var(--f-body);letter-spacing:.1em}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--veil-line);border-radius:14px;overflow:hidden;margin:0}
.stats div{background:var(--felt-2);padding:12px 14px}
.stats dt{font-size:12px;color:var(--on-felt-soft)}
.stats dd{margin:0;font-family:var(--f-num);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.review{display:flex;flex-direction:column;gap:8px}
.rv{display:flex;align-items:center;gap:12px;background:var(--veil);border:1px solid var(--veil-line);border-radius:12px;padding:8px 12px}
.rv .tile{box-shadow:0 3px 0 var(--jade),0 4px 0 var(--jade-dk)}
.rv div{min-width:0}
.rv b{font-family:var(--f-num);color:var(--gold);font-size:15px;margin-right:6px}
.rv span{color:var(--on-felt-soft);font-size:13px}
.res-btns{display:flex;gap:10px;flex-wrap:wrap}
.res-btns .btn{flex:1 1 130px}
@media (prefers-reduced-motion:reduce){.tiles.shake,.float,.key.glow{animation:none}.tiles.pop{animation-duration:.01s}}

function rnd(a){ return a[Math.random()*a.length|0]; }
const shuffle = a => { for (let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; };
const pick = (a,n) => shuffle([...a]).slice(0,n);

/* ---------- 音效 ---------- */
let actx = null;
function beep(type){
  if (!prefs.sound) return;
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    const seq = {tick:[[880,.035,'triangle']], step:[[740,.06,'triangle']], err:[[150,.13,'square']],
      chime:[[660,.08,'triangle'],[990,.12,'triangle']], thud:[[120,.28,'sine']], done:[[660,.08,'triangle'],[880,.08,'triangle'],[1180,.16,'triangle']]}[type] || [];
    let t = actx.currentTime;
    seq.forEach(([f,d,w]) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = w; o.frequency.value = f;
      g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(type==='err'?.05:.12,t+.01);
      g.gain.exponentialRampToValueAtTime(.0001,t+d);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t+d+.02); t += d*.8;
    });
  } catch {}
}

let kbMode = prefs.kb === 'en' ? 'en' : 'zh';
function makeKb(el){
  const rows = ['QWERTYUIOP','ASDFGHJKL','ZXCVBNM'];
  el.innerHTML = rows.map((r,ri) => `<div class="row">${ri===2 ? '<button type="button" class="key mode" data-mode="1" aria-label="切換顯示字根或英文字母"><span class="m-zh">中</span>／<span class="m-en">英</span></button>' : ''}${[...r].map(k => {
    const off = (k==='X'||k==='Z');
    return `<button type="button" class="key${off?' off':''}" data-k="${k}" ${off?'':`data-g="${keyGroup[k]}"`} aria-label="${k} ${ROOTS[k]}"><span class="l">${k}</span><span class="r">${ROOTS[k]}</span></button>`;
  }).join('')}</div>`).join('');
  el.addEventListener('pointerdown', e => {
    const b = e.target.closest('.key'); if (!b) return;
    e.preventDefault();
    if (b.dataset.mode) return toggleKb();
    route(b.dataset.k);
  });
}
function setKbMode(m, persist){
  kbMode = m;
  document.body.classList.toggle('kb-en', m === 'en');
  $$('.m-zh').forEach(s => s.classList.toggle('on', m === 'zh'));
  $$('.m-en').forEach(s => s.classList.toggle('on', m === 'en'));
  if (persist){ prefs.kb = m; savePrefs(); }
}
function toggleKb(){ setKbMode(kbMode === 'zh' ? 'en' : 'zh', true); beep('tick'); }
function route(k){
  if (!$('#game').hidden) press(k);
  else if (!$('#learn').hidden && !$('#lessonPlayer').hidden) lessonPress(k);
}
function flash(k, cls){
  $$(`.key[data-k="${k}"]`).forEach(b => { b.classList.remove('good','bad'); void b.offsetWidth; b.classList.add(cls); setTimeout(() => b.classList.remove(cls), 200); });
}
function glow(k){
  $$('.key.glow').forEach(b => b.classList.remove('glow'));
  if (k) $$(`.key[data-k="${k}"]`).forEach(b => b.classList.add('glow'));
}

let LP = null, Q = null;
function renderLessonList(){

function openLearn(){

}
function openLesson(i){
  LP = {li:i, si:0}; Q = null;
  $('#lessonList').hidden = true; $('#lessonPlayer').hidden = false;
  renderStep();
}
function leaveQuiz(){
  if (Q && Q.prevMode) setKbMode(Q.prevMode, false);
  Q = null; glow(null);
}
function renderStep(){
  leaveQuiz();
  const L = LESSONS[LP.li], st = L.steps[LP.si];
  $('#lpTitle').textContent = L.title;
  $('#lpDots').innerHTML = L.steps.map((_,i) => `<i class="${i<=LP.si?'on':''}"></i>`).join('');
  $('#lpPrev').disabled = LP.si === 0;
  $('#lpNext').textContent = LP.si === L.steps.length-1 ? '完成這一課' : '下一步';
  if (st.type === 'info'){
    $('#lpBody').innerHTML = st.html();
    $('#learnKb').hidden = true; $('#lpNext').disabled = false;
  } else {
    Q = {kind:st.kind, title:st.title, items:st.items(), i:0, ki:0, wrong:0, done:false, phase:'code', feed:'', fcls:''};
    if (st.en && kbMode !== 'en'){ Q.prevMode = kbMode; setKbMode('en', false); Q.feed = '鍵盤已轉做「英」模式，完成練習後會轉回來。'; }
    $('#learnKb').hidden = false; $('#lpNext').disabled = true;
    renderQuiz();
  }
  $('#lpBody').scrollTop = 0;
}
function qCode(it){
  if (Q.kind === 'root') return it;
  if (Q.kind === 'form') return it[1];
  return DICT[it];
}
function renderQuiz(){
  const n = Q.items.length;
  let prompt = '', expect = null;
  if (Q.done){
    prompt = `<div class="tile" style="--tile-ink:var(--red)">好</div><p>全部答對了！按「${LP.si === LESSONS[LP.li].steps.length-1 ? '完成這一課' : '下一步'}」繼續。</p>`;
  } else {
    const it = Q.items[Q.i], code = qCode(it);
    if (Q.kind === 'root'){
      prompt = `<div class="tile" style="--tile-ink:var(--green)">${ROOTS[it]}</div><p>按「${ROOTS[it]}」所在的鍵</p>`;
      if (Q.wrong > 0) expect = code;
    } else if (Q.kind === 'form'){
      prompt = `<div class="tile" style="--tile-ink:var(--green)">${it[0]}</div><p>這個變形屬於哪個字根？${Q.wrong>0 ? `<br><span class="small">提示：${it[0]} 是「${it[2]}」</span>` : ''}</p>`;
      if (Q.wrong > 0) expect = code;
    } else if (Q.kind === 'char'){
      prompt = `<div class="tile" style="--tile-ink:var(--blue)">${it}</div><div class="line" style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">${chips({ch:it, code}, Q.ki, true)}</div><p class="small">${NOTES[it] || ''}</p>`;
      expect = code[Q.ki];
    } else if (Q.kind === 'cand'){
      if (Q.phase === 'code'){
        prompt = `<p>打出「<span class="big">${it}</span>」</p><div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">${chips({ch:it, code}, Q.ki, true)}</div>`;
        expect = code[Q.ki];
      } else {
        prompt = `<p>選字窗彈出來了，揀「<span class="big">${it}</span>」</p><div class="candbar"><span class="typed">${code}</span>${Q.cands.map((c,i) => `<button type="button" class="cand" data-cand="${c}"><small>${i+1}</small>${c}</button>`).join('')}</div><p class="small">可以直接點選，或按數字鍵 1 至 4。</p>`;
      }
    }
  }
  $('#lpBody').innerHTML = `<div class="qhead"><h3>${Q.title}</h3><span>${Math.min(Q.i+1,n)} / ${n}</span></div>
    <div class="qprompt">${prompt}</div><div class="qfeed ${Q.fcls}">${Q.feed}</div>`;
  glow(expect);
}
function qAdvance(){
  Q.i++; Q.ki = 0; Q.wrong = 0; Q.phase = 'code';
  Q.feed = '答對了！'; Q.fcls = 'good';
  if (Q.i >= Q.items.length){ Q.done = true; Q.feed = ''; $('#lpNext').disabled = false; beep('done'); glow(null); }
  else beep('chime');
  renderQuiz();
}
function lessonPress(k){
  if (!Q || Q.done || (Q.kind === 'cand' && Q.phase === 'pick')) return;
  if (k === 'X' || k === 'Z') return;
  const it = Q.items[Q.i], code = qCode(it);
  const exp = (Q.kind === 'root' || Q.kind === 'form') ? code : code[Q.ki];
  if (k === exp){
    flash(k, 'good');
    if (Q.kind === 'root' || Q.kind === 'form') return qAdvance();
    Q.ki++;
    if (Q.ki >= code.length){
      if (Q.kind === 'cand'){ Q.phase = 'pick'; Q.cands = shuffle([...CAND_SET]); Q.feed = ''; Q.fcls = ''; beep('step'); return renderQuiz(); }
      return qAdvance();
    }
    Q.feed = ''; Q.fcls = ''; beep('tick'); renderQuiz();
  } else {
    flash(k, 'bad'); beep('err'); Q.wrong++;
    Q.fcls = 'bad';
    if (Q.kind === 'root') Q.feed = `這是「${ROOTS[k]}」（${k}）。「${ROOTS[exp]}」在 ${exp} 鍵，已經幫你亮起。`;
    else if (Q.kind === 'form') Q.feed = `${it[0]} 屬於「${it[2]}」，在 ${exp} 鍵。`;
    else Q.feed = `要按的是「${ROOTS[exp]}」（${exp}），看亮起的鍵。`;
    renderQuiz();
  }
}
function pickCand(c){
  if (!Q || Q.kind !== 'cand' || Q.phase !== 'pick') return;
  const it = Q.items[Q.i];
  if (c === it) qAdvance();
  else { beep('err'); Q.feed = `這是「${c}」，再揀一次「${it}」。`; Q.fcls = 'bad'; renderQuiz(); }
}

const TIME_OPTS = [[0,'不限時'],[180,'3 分鐘'],[300,'5 分鐘'],[600,'10 分鐘'],[900,'15 分鐘'],[1800,'30 分鐘']];
const CAT_OPTS = [['all','全部'],['daily','日常生活'],['work','工作辦公']];
const FROM_OPTS = [['start','由單字開始'],['sent','直接打句子']];
function renderSetup(){

    : '不限時：有 3 條命，每完成 20 組多送一條，看你撐得多久。';

}

/* =========================================================
   遊戲
   ========================================================= */
let S = null, last = 0, raf = 0;

function buildQueue(lv){
  if (lv === 4) return [];
  if (lv === 1){
    const q = []; let pool = [];
    GROUPS.forEach((g,gi) => {
      const fresh = [...g.keys]; pool = pool.concat(fresh);
      const wave = shuffle([...fresh]);
      while (wave.length < 8) wave.push(pool[Math.random()*pool.length|0]);
      shuffle(wave);
      for (let i=1;i<wave.length;i++) if (wave[i]===wave[i-1]) { const j=(i+2)%wave.length; [wave[i],wave[j]]=[wave[j],wave[i]]; }
      wave.forEach((k,i) => q.push({items:[{ch:ROOTS[k],code:k}], wave: i===0 ? gi : null}));
    });
    return q;
  }
  if (lv === 2){
    const easy = MID.filter(m => m[1][0]===m[1][1] || ['明','天','早','古','上','下'].includes(m[0]));
    const rest = MID.filter(m => !easy.includes(m));
    return [...pick(easy,4), ...pick(rest,16)].map(([ch,code]) => ({items:[{ch,code}]}));
  }
  return [...pick(PHRASES[2],4), ...pick(PHRASES[3],4), ...pick(PHRASES[4],4)].map(p => ({items:toItems(p)}));
}
function poolWords(cat){ return cat === 'all' ? [...WORDS.daily, ...WORDS.work] : WORDS[cat]; }
function poolSingles(cat){ return [...new Set(poolWords(cat).join(''))].filter(c => DICT[c] && DICT[c].length === 2); }
function makeSentence(cat){ return rnd(PATTERNS.filter(p => cat === 'all' || p.cat === cat)).f(); }
function genText(stage){
  const cat = S.opts.cat;
  for (let i = 0; i < 80; i++){
    const s = stage === 0 ? rnd(S.singles) : stage === 1 ? rnd(poolWords(cat)) : makeSentence(cat);
    if (s.length <= 8 && !S.seen.has(s)){ S.seen.add(s); return s; }
  }
  if (stage === 2) S.seen.clear();
  let s; do { s = makeSentence(cat); } while (s.length > 8);
  return s;
}

function start(lv, opts){
  beep('tick');
  if (lv === 4){ opts = opts || {...prefs.inf}; }
  const timed = lv === 4 && opts.limit > 0;
  S = {lv, opts:opts||{}, q:buildQueue(lv), qi:-1, lives: timed ? Infinity : 3, maxLives:3, score:0, combo:0, maxCombo:0, ok:0, bad:0, done:0,
       misses:{}, play:0, paused:false, over:false, cur:null, prog:0, dur:1, hold:0, banner:false, bannerQueue:null,
       cleared:0, seen:new Set(), stage:-1, limit: timed ? opts.limit : 0, left: timed ? opts.limit : 0, lastSec:-1};
  if (lv === 4) S.singles = poolSingles(S.opts.cat);
  $('#tiles').style.setProperty('--tile-ink', LEVELS[lv].ink);
  show('game'); $('#pauseOv').hidden = true; $('#endBtn').hidden = (lv !== 4);
  $('#hearts').hidden = timed; $('#timer').hidden = !timed;
  const intro = ['','字根會從上面跌落，在落地前按下對應的鍵。','把字拆成首尾兩個字根，連按兩個鍵。','逐個字打出整組詞語，打錯了才有提示。',
    `香港${{all:'生活及工作',daily:'日常生活',work:'工作辦公'}[S.opts.cat]}字句，隨機組合，每局都不同。`][lv];
  const rule = lv === 4 ? (timed ? `練習 ${S.limit/60} 分鐘，牌落地不扣命，只會斷連擊。` : '有 3 條命，每完成 20 組多送一條，最多 5 條。') : '有 3 條命，牌落地就扣一條。';
  showBanner(`<h2>${LEVELS[lv].name}</h2><p>${intro}</p><p>${rule}</p>`, 2.4);
  next(true);
  last = performance.now(); cancelAnimationFrame(raf); raf = requestAnimationFrame(loop);
}

function next(first){
  S.qi++;
  const L = LEVELS[S.lv];
  let t, bannerHtml = null;
  if (S.lv === 4){
    const stage = S.opts.from === 'sent' ? 2 : (S.cleared < 8 ? 0 : S.cleared < 20 ? 1 : 2);
    if (stage !== S.stage){
      S.stage = stage;
      bannerHtml = `<h2>${INF_STAGES[stage].name}</h2><p>${INF_STAGES[stage].tip}</p>`;
      $('#tiles').style.setProperty('--tile-ink', ['var(--green)','var(--blue)','var(--red)'][stage]);
    }
    t = {items: toItems(genText(stage))};
    const perChar = Math.max(2.5, 6 - S.cleared * .05);
    S.dur = t.items.length === 1 ? perChar * 1.6 : perChar * t.items.length;
  } else {
    if (S.qi >= S.q.length) return finish(true);
    t = S.q[S.qi];
    const frac = S.qi / Math.max(1, S.q.length-1);
    const per = L.durA + (L.durB - L.durA) * frac;
    S.dur = S.lv === 3 ? per * t.items.length : per;
    if (t.wave != null){
      const g = GROUPS[t.wave];
      const keys = [...g.keys].map(k=>`<span class="rk"><b>${ROOTS[k]}</b><small>${k}</small></span>`).join('');
      bannerHtml = `<h2>${g.name}</h2><div class="brow">${keys}</div><p>${g.tip}</p>`;
    }
  }
  S.cur = {items:t.items, ci:0, ki:0, hinted:false, resolving:false, rt:0, final:false};
  S.prog = 0;
  if (bannerHtml){
    if (first) S.bannerQueue = {html:bannerHtml, t:2.4};
    else showBanner(bannerHtml, 2.4);
  } else if (!first) S.hold = .3;
  const tiles = $('#tiles');
  tiles.className = 'tiles';
  const n = t.items.length, size = n >= 8 ? 'xxs' : n >= 5 ? 'xs' : n >= 3 ? 'sm' : '';
  tiles.style.gap = n >= 7 ? '4px' : '';
  tiles.innerHTML = t.items.map((it,i) => `<div class="tile ${size}${n>1&&i===0?' now':''}">${it.ch}</div>`).join('');
  renderHud(); renderHint(); renderKeys(); place();
}

function showBanner(html, t){
  $('#bannerBox').innerHTML = html; $('#banner').hidden = false;
  S.banner = true; S.hold = t;
}

function loop(now){
  const dt = Math.min(.05, (now-last)/1000); last = now;
  if (S && !S.paused && !S.over){
    S.play += dt;
    const c = S.cur;
    if (S.limit && !S.banner){
      S.left -= dt;
      renderTimer();
      if (S.left <= 0){ S.left = 0; renderTimer(); finish(true); raf = requestAnimationFrame(loop); return; }
    }
    if (S.hold > 0){
      S.hold -= dt;
      if (S.hold <= 0){
        if (S.bannerQueue){ const b = S.bannerQueue; S.bannerQueue = null; showBanner(b.html, b.t); }
        else if (S.banner){ S.banner = false; $('#banner').hidden = true; }
      }
    } else if (c && c.resolving){
      c.rt -= dt;
      if (c.rt <= 0){ if (c.final) finish(false); else next(); }
    } else if (c){
      S.prog += dt / S.dur;
      const L = LEVELS[S.lv];
      if (L.hintAt != null && !c.hinted && S.prog >= L.hintAt){ c.hinted = true; renderHint(); renderKeys(); }
      if (S.prog >= 1){ S.prog = 1; miss(); }
      place();
    }
  }
  raf = requestAnimationFrame(loop);
}
function renderTimer(){
  const sec = Math.ceil(S.left);
  if (sec === S.lastSec) return;
  S.lastSec = sec;
  const el = $('#timer');
  el.textContent = `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`;
  el.classList.toggle('low', sec <= 30);
}

function place(){
  const field = $('#field'), tiles = $('#tiles');
  const dist = Math.max(0, field.clientHeight - tiles.offsetHeight - 12 - 16 - 14);
  const ty = `translateY(${(S.prog*dist).toFixed(1)}px)`;
  tiles.style.setProperty('--ty', ty);
  if (!tiles.classList.contains('pop')) tiles.style.transform = ty;
}

function press(k){
  if (!S || S.paused || S.over || S.banner || !S.cur || S.cur.resolving) return;
  if (k === 'X' || k === 'Z') return;
  const c = S.cur, it = c.items[c.ci], exp = it.code[c.ki];
  if (k === exp){
    S.ok++; c.ki++; flash(k,'good');
    if (c.ki >= it.code.length) charDone(); else { beep('tick'); renderHint(); renderKeys(); }
  } else {
    S.bad++; S.combo = 0; flash(k,'bad'); beep('err');
    S.misses[it.ch] = (S.misses[it.ch]||0) + 1;
    const tiles = $('#tiles'); tiles.classList.remove('shake'); void tiles.offsetWidth; tiles.classList.add('shake');
    if (S.lv === 3) c.hinted = true;
    renderHud(); renderHint(); renderKeys();
  }
}
function charDone(){
  const c = S.cur; S.done++;
  const tiles = $('#tiles').children;
  if (c.items.length > 1){ tiles[c.ci].classList.remove('now'); tiles[c.ci].classList.add('done'); }
  c.ci++; c.ki = 0;
  if (c.ci >= c.items.length) return targetDone();
  tiles[c.ci].classList.add('now');
  if (S.lv === 3) c.hinted = false;
  if (S.lv === 4) c.hinted = false;
  beep('step'); renderHint(); renderKeys();
}
function targetDone(){
  const c = S.cur, L = LEVELS[S.lv];
  c.resolving = true; c.rt = .45;
  S.combo++; S.maxCombo = Math.max(S.maxCombo, S.combo);
  S.cleared++;
  let bonusLife = false;
  if (S.lv === 4 && !S.limit && S.cleared % 20 === 0 && S.lives < 5){ S.lives++; S.maxLives = Math.max(S.maxLives, S.lives); bonusLife = true; }
  const n = c.items.length;
  const gain = Math.round(L.pts * n * (1 + Math.min(S.combo,20)*.05)) + Math.round((1-S.prog) * 10 * n);
  S.score += gain;
  floatText('+' + gain);
  $('#tiles').classList.add('pop');
  beep('chime'); renderHud(); renderKeys();
  $('#hint').innerHTML = `<div class="line"><span class="big">${c.items.map(i=>i.ch).join('')}</span><span>${c.items.map(i=>i.code).join(' ')}</span></div><div class="note">${bonusLife ? `完成 ${S.cleared} 組，多送一條命！` : S.combo>=3 ? `連擊 ${S.combo}！分數加成中` : '答對了'}</div>`;
}
function miss(){
  const c = S.cur;
  c.resolving = true; c.rt = 1.9;
  S.combo = 0;
  if (!S.limit) S.lives--;
  c.items.slice(c.ci).forEach(it => S.misses[it.ch] = (S.misses[it.ch]||0) + 1);
  if (S.lives <= 0) c.final = true;
  $('#tiles').classList.add('hit');
  beep('thud'); renderHud(); renderKeys();
  const rest = c.items.slice(c.ci);
  $('#hint').innerHTML = `<div class="line answer">落地了！記住答案：</div><div class="line">${rest.map(it =>
    `<span class="chip"><b>${it.ch}</b><code>${it.code}</code><em>${[...it.code].map(k=>ROOTS[k]).join(' ')}</em></span>`).join('')}</div>`;
}
function floatText(t){
  const el = document.createElement('div');
  el.className = 'float'; el.textContent = t;
  const tiles = $('#tiles');
  el.style.top = (tiles.offsetTop + S.prog * Math.max(0, $('#field').clientHeight - tiles.offsetHeight - 42)) + 'px';
  $('#field').appendChild(el); setTimeout(() => el.remove(), 950);
}

function renderHud(){
  const L = LEVELS[S.lv];
  $('#hudLv').innerHTML = S.lv === 4
    ? `${L.name}<small>第 ${S.cleared+1} 組 · ${INF_STAGES[Math.max(0,S.stage)].short}</small>`
    : `${L.name}<small>${Math.min(S.qi+1,S.q.length)} / ${S.q.length}</small>`;
  if (!S.limit) $('#hearts').innerHTML = Array.from({length:S.maxLives}, (_,i) => `<span class="${i<S.lives?'':'lost'}">♥</span>`).join('');
  $('#score').textContent = S.score;
  $('#combo').textContent = S.combo >= 2 ? `連擊×${S.combo}` : '';
}
function chips(it, ki, revealKeys){
  const n = it.code.length;
  return [...it.code].map((k,i) => {
    const label = n === 1 ? '字根本身' : (i === 0 ? '首碼' : '尾碼');
    const st = i < ki ? ' ok' : (i === ki ? ' next' : '');
    return `<span class="chip${st}"><em>${label}</em><b>${ROOTS[k]}</b><code>${(i<ki||revealKeys)?k:'?'}</code></span>`;
  }).join('<span class="note">+</span>');
}
function renderHint(){
  const c = S.cur, h = $('#hint'); if (!c) return;
  const it = c.items[c.ci];
  const pos = c.items.length > 1 ? `第 ${c.ci+1} / ${c.items.length} 字　` : '';
  if (S.lv === 1){
    const g = GROUPS[keyGroup[it.code]];
    h.innerHTML = `<div class="line">在鍵盤上找出 <span class="big">${it.ch}</span> 字根</div>
      <div class="note">${c.hinted ? `提示：它在 <b style="color:var(--gold)">${it.code}</b> 鍵，已經幫你亮起` : `${g.short}：${g.tip}`}</div>`;
  } else if (S.lv === 2 || S.lv === 4){
    const note = NOTES[it.ch] || (it.code.length === 1 ? '它本身就是一個字根' : '取第一個和最後一個字根');
    h.innerHTML = `<div class="line"><span class="big">${it.ch}</span>${chips(it, c.ki, c.hinted)}</div>
      <div class="note">${pos}${note}${c.hinted ? '' : '　（找不到？稍後會亮起）'}</div>`;
  } else {
    if (c.hinted){
      h.innerHTML = `<div class="line"><span class="big">${it.ch}</span>${chips(it, c.ki, true)}</div>
        <div class="note">${pos}${NOTES[it.ch] || (it.code.length===1 ? '它本身就是一個字根' : '取第一個和最後一個字根')}</div>`;
    } else {
      h.innerHTML = `<div class="line">${pos}打出 <span class="big">${it.ch}</span>${c.ki ? `<span class="chip ok"><code>${it.code.slice(0,c.ki)}</code></span>` : ''}</div>
        <div class="line"><button type="button" class="hint-btn" id="hintBtn">看拆法（−20 分）</button></div>`;
      $('#hintBtn').addEventListener('click', () => {
        if (!S.cur || S.cur.resolving) return;
        S.cur.hinted = true; S.score = Math.max(0, S.score-20);
        renderHud(); renderHint(); renderKeys();
      });
    }
  }
}
function renderKeys(){
  const c = S && S.cur;
  if (!c || c.resolving || !c.hinted) return glow(null);
  glow(c.items[c.ci].code[c.ki]);
}

function setPause(p){
  if (!S || S.over) return;
  S.paused = p; $('#pauseOv').hidden = !p;
  if (!p) last = performance.now();
}
function finish(cleared){
  if (S.over) return;
  S.over = true; cancelAnimationFrame(raf); glow(null);
  const L = LEVELS[S.lv], inf = S.lv === 4, timed = inf && S.limit > 0;
  const acc = S.ok + S.bad ? S.ok / (S.ok + S.bad) : 0;
  const mins = Math.max(1, S.play / 60);
  let stars;
  if (inf){
    if (timed){ const rate = S.cleared / mins; stars = rate >= 4 ? 3 : rate >= 2.5 ? 2 : rate >= 1.2 ? 1 : 0; }
    else stars = S.cleared >= 45 ? 3 : S.cleared >= 25 ? 2 : S.cleared >= 10 ? 1 : 0;
  } else stars = !cleared ? 0 : 1 + (S.lives>=2 && acc>=.8 ? 1 : 0) + (S.lives===3 && acc>=.92 ? 1 : 0);
  const cpm = S.play > 0 ? Math.round(S.done / (S.play/60)) : 0;
  const key = String(S.lv);
  const isBest = S.score > (best[key] || 0);
  if (isBest){ best[key] = S.score; save('sucheng-best-v2', best); }
  const titles = inf && timed ? ['繼續練習','有進步','穩步上揚','出神入化'] : ['再試一次','繼續加油','穩步上揚','出神入化'];
  const playedMin = Math.round(S.play / 60);
  const lines = inf ? (timed
    ? [`練習了 ${playedMin || '不足 1'} 分鐘，完成 ${S.cleared} 組。慢慢來，準確比快更重要。`,
       `練習了 ${playedMin} 分鐘，完成 ${S.cleared} 組，手指開始記得位置了。`,
       `練習了 ${playedMin} 分鐘，完成 ${S.cleared} 組，已經打得出句子了！`,
       `練習了 ${playedMin} 分鐘，完成 ${S.cleared} 組，返工打中文已經難不到你。`]
    : [`撐過 ${S.cleared} 組。看看最常錯的字，記熟再來。`,`撐過 ${S.cleared} 組，手指開始記得位置了。`,`撐過 ${S.cleared} 組，已經打得出句子了！`,`撐過 ${S.cleared} 組，速成已經難不到你。`])
    : ['三條命用完了。看看下面最常錯的字，記熟再來。','過關了！多玩幾次，手指會自己記住位置。','打得不錯，錯得不多，可以挑戰下一級了。','又快又準，這個難度難不到你。'];
  const missList = Object.entries(S.misses).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const review = missList.length ? `<div class="review"><div class="sect-label">重溫最常錯的字</div>${missList.map(([ch]) => {
      const code = DICT[ch];
      return `<div class="rv"><div class="tile xs" style="--tile-ink:${L.ink}">${ch}</div><div><b>${code}</b><span>${[...code].map(k=>ROOTS[k]).join(' + ')}${NOTES[ch]?'　'+NOTES[ch]:''}</span></div></div>`;
    }).join('')}</div>` : '';
  const nextBtn = S.lv < 3 && cleared ? `<button class="btn" type="button" data-lv="${S.lv+1}">挑戰${LEVELS[S.lv+1].name}</button>` : '';
  const kbTip = kbMode === 'zh' && stars >= 2 ? `<p class="small" style="text-align:center">打得順手了？試下把鍵盤轉做「英」模式，練習不看字根。</p>` : '';
  $('#resBody').innerHTML = `
    <div class="res-head">
      <div class="stars">${[0,1,2].map(i=>`<span class="${i<stars?'':'dim'}">★</span>`).join('')}</div>
      <h2>${titles[stars]}</h2>
      <p>${L.name}${inf ? `（${timed ? S.limit/60+' 分鐘' : '不限時'}）` : ' · '+L.sub}　${lines[stars]}</p>
      <div class="res-score">${S.score}<small>${isBest ? '新紀錄' : '分數'}</small></div>
    </div>
    <dl class="stats">
      <div><dt>準確率</dt><dd>${Math.round(acc*100)}%</dd></div>
      <div><dt>${inf ? '完成組數' : '完成字數'}</dt><dd>${inf ? S.cleared : S.done}</dd></div>
      <div><dt>最高連擊</dt><dd>${S.maxCombo}</dd></div>
      <div><dt>速度（字／分鐘）</dt><dd>${cpm}</dd></div>
    </dl>
    ${kbTip}
    ${review}
    <div class="res-btns">
      ${nextBtn}
      <button class="btn${nextBtn?' ghost':''}" type="button" data-replay="1">再玩一次</button>
      ${inf ? '<button class="btn ghost" type="button" data-go="setup">更改設定</button>' : ''}
      <button class="btn ghost" type="button" data-go="menu">回主頁</button>
    </div>`;
  S.lastStart = {lv:S.lv, opts:S.opts};
  show('result');
}

/* =========================================================
   事件
   ========================================================= */
document.addEventListener('click', e => {
  const lv = e.target.closest('[data-lv]'); if (lv) return start(+lv.dataset.lv);
  const rp = e.target.closest('[data-replay]'); if (rp && S) return start(S.lv, S.lv === 4 ? S.opts : undefined);
  const les = e.target.closest('[data-lesson]'); if (les) return openLesson(+les.dataset.lesson);
  const cd = e.target.closest('[data-cand]'); if (cd) return pickCand(cd.dataset.cand);
  const op = e.target.closest('[data-opt]');
  if (op){ const v = op.dataset.val; prefs.inf[op.dataset.opt] = op.dataset.opt === 'limit' ? +v : v; savePrefs(); renderSetup(); return; }
  const go = e.target.closest('[data-go]');
  if (go){
    const g = go.dataset.go;
    if (g === 'menu') show('menu');
    else if (g === 'learn') openLearn();
    else if (g === 'setup'){ renderSetup(); show('setup'); }
  }
});
$('#setupStart').addEventListener('click', () => start(4, {...prefs.inf}));
$('#lpBack').addEventListener('click', () => { leaveQuiz(); openLearn(); });
$('#lpPrev').addEventListener('click', () => { if (LP.si > 0){ LP.si--; renderStep(); } });
$('#lpNext').addEventListener('click', () => {
  const L = LESSONS[LP.li];
  if (LP.si < L.steps.length-1){ LP.si++; renderStep(); }
  else { prefs.lessons[L.id] = true; savePrefs(); leaveQuiz(); beep('done'); openLearn(); }
});
$('#pauseBtn').addEventListener('click', () => setPause(true));
$('#resumeBtn').addEventListener('click', () => setPause(false));
$('#endBtn').addEventListener('click', () => { if (S && !S.over){ $('#pauseOv').hidden = true; S.paused = false; finish(false); } });
$('#quitBtn').addEventListener('click', () => { S.over = true; cancelAnimationFrame(raf); glow(null); show('menu'); });
$('#soundBtn').addEventListener('click', e => { prefs.sound = !prefs.sound; savePrefs(); e.currentTarget.textContent = '音效：' + (prefs.sound?'開':'關'); });

let shiftAlone = false;
document.addEventListener('keydown', e => {
  if (e.key === 'Shift'){ shiftAlone = !e.repeat; return; }
  shiftAlone = false;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const inGame = !$('#game').hidden && S;
  const inLesson = !$('#learn').hidden && !$('#lessonPlayer').hidden && Q;
  if (inGame && e.key === 'Escape'){ setPause(!S.paused); return; }
  if (inLesson && Q.kind === 'cand' && Q.phase === 'pick' && /^[1-4]$/.test(e.key)){ pickCand(Q.cands[+e.key-1]); return; }
  const k = e.key.length === 1 ? e.key.toUpperCase() : '';
  if ((inGame || inLesson) && k >= 'A' && k <= 'Z'){ e.preventDefault(); route(k); }
});
document.addEventListener('keyup', e => { if (e.key === 'Shift' && shiftAlone) toggleKb(); shiftAlone = false; });
document.addEventListener('visibilitychange', () => { if (document.hidden && S && !S.over && !$('#game').hidden) setPause(true); });

buildRootTable(); makeKb($('#kb')); makeKb($('#learnKb'));
setKbMode(kbMode, false);
$('#soundBtn').textContent = '音效：' + (prefs.sound ? '開' : '關');
refreshMenu();
})();
</script>

</body>
</html>
